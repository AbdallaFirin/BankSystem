<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="refresh" content="8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gobaad Bank — Starting Up</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: Arial, sans-serif;
    background: radial-gradient(ellipse at 20% 50%, rgba(11,25,41,.95) 0%, #060e18 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #A9B8C6;
  }
  .card {
    text-align: center;
    max-width: 420px;
    padding: 48px 40px;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    background: rgba(255,255,255,0.02);
  }
  .spinner {
    width: 48px; height: 48px;
    border: 3px solid rgba(201,168,76,0.2);
    border-top-color: #C9A84C;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin: 0 auto 24px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { color: #C9A84C; font-size: 20px; margin-bottom: 12px; letter-spacing: 1px; }
  p  { font-size: 14px; line-height: 1.7; }
  small { display: block; margin-top: 20px; font-size: 11px; color: #4a5568; }
</style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h1>GOBAAD BANK</h1>
    <p>The application is starting up.<br>This page will refresh automatically in a few seconds.</p>
    <small>First-run setup: installing dependencies and running migrations…</small>
  </div>
</body>
</html>
