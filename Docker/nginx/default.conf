server {
    listen 80;
    server_name localhost;

    # Laravel public directory
    root /var/www/html/public;
    index index.php index.html;

    # Max upload size (match php.ini)
    client_max_body_size 20M;

    # ── Static assets — serve directly, no PHP ────────────────────────────────
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── All other requests → Laravel front controller ─────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── PHP-FPM ───────────────────────────────────────────────────────────────
    location ~ \.php$ {
        fastcgi_pass         app:9000;
        fastcgi_index        index.php;
        fastcgi_param        SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include              fastcgi_params;
        fastcgi_read_timeout 120;
        fastcgi_buffer_size  16k;
        fastcgi_buffers      4 16k;
    }

    # ── Custom 502 page while app is warming up ───────────────────────────────
    error_page 502 503 @starting;
    location @starting {
        default_type text/html;
        return 502 '<!DOCTYPE html><html><head><meta charset="UTF-8"><meta http-equiv="refresh" content="6"><title>Gobaad Bank — Starting</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Arial,sans-serif;background:#060e18;min-height:100vh;display:flex;align-items:center;justify-content:center;color:#A9B8C6}.card{text-align:center;padding:48px 40px;border:1px solid rgba(255,255,255,.08);border-radius:16px}.spinner{width:48px;height:48px;border:3px solid rgba(201,168,76,.2);border-top-color:#C9A84C;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 24px}@keyframes spin{to{transform:rotate(360deg)}}h1{color:#C9A84C;font-size:20px;margin-bottom:12px}p{font-size:14px;line-height:1.7}small{display:block;margin-top:20px;font-size:11px;color:#4a5568}</style></head><body><div class="card"><div class="spinner"></div><h1>GOBAAD BANK</h1><p>Application is starting up.<br>This page refreshes automatically.</p><small>Installing dependencies and running migrations on first run…</small></div></body></html>';
    }

    # ── Block hidden files (.env, .git, etc.) ─────────────────────────────────
    location ~ /\. {
        deny all;
        return 404;
    }

    # ── Logging ───────────────────────────────────────────────────────────────
    access_log /var/log/nginx/gobaad_access.log;
    error_log  /var/log/nginx/gobaad_error.log;
}
