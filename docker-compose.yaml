services:

  nginx:
    image: ghcr.io/abdallafirin/banksystem-nginx:latest
    build:
      context: ./Docker/nginx
      dockerfile: Dockerfile
    pull_policy: always
    container_name: gobaad_nginx
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
      - build_data:/var/www/html/public/build
    depends_on:
      - app
    networks:
      - gobaad_net
    restart: unless-stopped

  app:
    image: ghcr.io/abdallafirin/banksystem-app:latest
    build:
      context: ./Docker/php
      dockerfile: Dockerfile
    pull_policy: always
    container_name: gobaad_app
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
      - node_modules_data:/var/www/html/node_modules
      - build_data:/var/www/html/public/build
    environment:
      APP_NAME: "Gobaad Bank"
      APP_ENV: production
      APP_KEY: base64:5k3EeWqEMkYtmEQhz01IRrfrpapKW3C7fporPBR6/aY=
      APP_DEBUG: "false"
      APP_URL: https://gobaadbank.wattco.so
      APP_LOCALE: en

      LOG_CHANNEL: stack
      LOG_LEVEL: error

      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: BankSystem
      DB_USERNAME: gobaad
      DB_PASSWORD: gobaad_pass

      SESSION_DRIVER: file
      SESSION_LIFETIME: 10
      SESSION_ENCRYPT: "false"
      SESSION_PATH: /
      SESSION_DOMAIN: "null"
      CACHE_STORE: file
      FILESYSTEM_DISK: local
      QUEUE_CONNECTION: sync

      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: gobaad-bank-001
      REVERB_APP_KEY: gobaad-bank-key
      REVERB_APP_SECRET: gobaad-bank-secret
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http

      VITE_REVERB_APP_KEY: gobaad-bank-key
      VITE_REVERB_HOST: gobaadbank.wattco.so
      VITE_REVERB_PORT: 8080
      VITE_REVERB_SCHEME: http

      MAIL_MAILER: smtp
      MAIL_SCHEME: tls
      MAIL_HOST: smtp.gmail.com
      MAIL_PORT: 587
      MAIL_USERNAME: cfriin7@gmail.com
      MAIL_PASSWORD: "sjen qsjx iwes wfis"
      MAIL_FROM_ADDRESS: cfriin7@gmail.com
      MAIL_FROM_NAME: "Gobaad Bank"

      BCRYPT_ROUNDS: 12

    depends_on:
      - mysql
    networks:
      - gobaad_net
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: gobaad_mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: BankSystem
      MYSQL_USER: gobaad
      MYSQL_PASSWORD: gobaad_pass
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - gobaad_net
    restart: unless-stopped

  reverb:
    image: ghcr.io/abdallafirin/banksystem-app:latest
    build:
      context: ./Docker/php
      dockerfile: Dockerfile
    pull_policy: always
    container_name: gobaad_reverb
    command: php artisan reverb:start --host=0.0.0.0 --port=8080 --no-interaction
    ports:
      - "8080:8080"
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
    environment:
      APP_NAME: "Gobaad Bank"
      APP_ENV: production
      APP_KEY: base64:5k3EeWqEMkYtmEQhz01IRrfrpapKW3C7fporPBR6/aY=
      APP_DEBUG: "false"
      APP_URL: https://gobaadbank.wattco.so

      LOG_CHANNEL: stack
      LOG_LEVEL: error

      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: BankSystem
      DB_USERNAME: gobaad
      DB_PASSWORD: gobaad_pass

      SESSION_DRIVER: file
      SESSION_LIFETIME: 10
      CACHE_STORE: file
      QUEUE_CONNECTION: sync

      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: gobaad-bank-001
      REVERB_APP_KEY: gobaad-bank-key
      REVERB_APP_SECRET: gobaad-bank-secret
      REVERB_HOST: 0.0.0.0
      REVERB_PORT: 8080
      REVERB_SCHEME: http

    depends_on:
      - mysql
      - app
    networks:
      - gobaad_net
    restart: unless-stopped

networks:
  gobaad_net:
    driver: bridge

volumes:
  mysql_data:
  vendor_data:
  node_modules_data:
  build_data:
